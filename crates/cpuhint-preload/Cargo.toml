[package]
name = "cpuhint-preload"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]
test = false

[dependencies]
cpuhint-core = { package = "cpuhint-core", path = "../cpuhint-core" }
cpuhint-linux = { package = "cpuhint-linux", path = "../cpuhint-linux" }
libc = { version = "0.2", default-features = false }
